# Homology of the braid groups of the 34 exceptional complex reflection groups W: with
# trivial coefficients (`trivial`) and with coefficients in the sign representation ℤε,
# where the braid reflections act by −1 (`sign`), H₀ to Hₙ for W of rank n; sizes of the
# Dehornoy–Lafont complexes of five well-generated groups.
#
# Provenance: tables 1, 3 and 4 of the article of [source] (section 3), transcribed from
# arXiv v2. Table 3 agrees with the values computed in J0 (homologie.jl, dual monoids,
# Gauss_a) and in J1 by Gauss, except for H₄ of G32. Each key holds the value expected by
# the tests; where it differs from the printed value, `errata` keeps the printed value,
# with the key and degree concerned, whether the author's erratum lists it (`listed`) and
# the reason.
#
# One table per group, in the order of the rows of tables 3 and 4, named as the snapshots
# (G4, …, G37). Groups are read by parse(FinitelyGeneratedAbelianGroup, s) and written in
# the form it displays. `well_generated = false` marks the 8 groups without a dual braid
# monoid (Garside monoids given by a presentation in J4, Garside category of G31 in J7).
# `real` names the Coxeter type of a real group; `isodiscriminantal` names the
# representative of its isodiscriminantality class in the tables: the braid groups of a
# class are isomorphic by an isomorphism sending braid reflections to braid reflections,
# hence have the same homology for both modules.
#
# Table 1: `cells_mar17` (row [Mar17], Dehornoy–Lafont complex of Marin, reproduced by the
# variant Gauss_d of J0) and `cells_optimised` (row "Optimized", order of section 2.2),
# numbers of cells in degrees 0 to n; `two_cell_bounds`: the lower and upper bounds of
# section 3.4 for the number of 2-cells of a Dehornoy–Lafont complex.

